# Render Blueprint — RepoSweep (single-origin: serves SPA + /api)
#
# Secrets (DATABASE_URL, GITHUB_CLIENT_ID/SECRET, and the callback URLs)
# are set with sync: false — paste them in Render's dashboard after you
# create the service (see README → "Deploying to Render").

services:
  - type: web
    name: reposweep
    runtime: python
    plan: free
    repo: https://github.com/benrehhhh/RepoSweep
    branch: main
    healthCheckPath: /api/health
    buildCommand: |
      pip install -r backend/requirements.txt
      npm ci --prefix frontend
      npm run build --prefix frontend
    startCommand: |
      cd backend
      python -m waitress --listen=0.0.0.0:${PORT} wsgi:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: GITHUB_REDIRECT_URI
        sync: false
      - key: FLASK_ENV
        value: production
      - key: MOCK_MODE
        value: "false"
      - key: FRONTEND_DIST
        value: ../frontend/dist
